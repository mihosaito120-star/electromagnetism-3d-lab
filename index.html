<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d3b4c" />
  <meta name="description" content="右ねじの法則、ビオ＝サバールの法則、アンペールの法則を3Dで操作して学ぶ教材" />
  <title>電流と磁場 3Dラボ</title>
  <link rel="stylesheet" href="./style.css?v=20261110-4" />
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">ELECTROMAGNETISM LAB</p>
      <h1>電流と磁場 <span>3Dラボ</span></h1>
    </div>
    <button id="reset-view" class="icon-button" type="button" aria-label="視点を元に戻す">視点を戻す</button>
  </header>

  <main>
    <nav class="step-tabs" aria-label="学習ステップ">
      <button type="button" class="step-tab is-active" data-mode="hand" aria-selected="true"><b>1</b><span>右ねじ</span></button>
      <button type="button" class="step-tab" data-mode="biot" aria-selected="false"><b>2</b><span>ビオ＝サバール</span></button>
      <button type="button" class="step-tab" data-mode="ampere" aria-selected="false"><b>3</b><span>アンペール</span></button>
    </nav>

    <section class="lesson-card">
      <div class="lesson-copy">
        <p class="step-label" id="step-label">STEP 1</p>
        <h2 id="lesson-title">電流を親指に合わせる</h2>
        <p id="lesson-text">右手の親指を電流の向きに合わせると、曲げた指が磁場の向きを示します。</p>
        <div class="law-formula" id="law-formula" hidden></div>
        <div class="question" id="question">電流を反転すると、磁場の回る向きはどうなるでしょう？</div>
      </div>

      <div class="stage-wrap">
        <div id="stage" role="img" aria-label="電流と磁場の三次元模型"></div>
        <div class="legend" aria-hidden="true">
          <span><i class="current"></i>電流 I</span>
          <span><i class="field"></i>磁場 B</span>
          <span id="r-legend" hidden><i class="vector"></i>位置 r</span>
          <span id="path-legend" hidden><i class="path"></i>積分経路 C</span>
        </div>
        <div class="gesture-hint">1本指で回転・2本指で拡大</div>
      </div>

      <div class="controls" aria-label="模型の操作">
        <div class="switch-row">
          <span>電流の向き</span>
          <button id="current-direction" class="direction-button" type="button" aria-pressed="false">
            <span class="direction-arrow">↑</span><span id="direction-label">上向き</span>
          </button>
        </div>
        <label class="range-row">
          <span><b id="range-label">電流の大きさ</b><output id="range-output">2.0 A</output></span>
          <input id="main-range" type="range" min="0.5" max="5" step="0.5" value="2" />
        </label>
        <div class="result" id="result"><span>右手の親指</span><strong>電流と同じ向き</strong></div>
      </div>
    </section>

    <section class="connection" aria-labelledby="connection-title">
      <h2 id="connection-title">3つの法則は、同じ磁場を見ています</h2>
      <ol>
        <li><b>向き</b><span>右ねじの法則</span></li>
        <li><b>一点への寄与</b><span>ビオ＝サバール</span></li>
        <li><b>対称性と一周</b><span>アンペール</span></li>
      </ol>
    </section>
  </main>

  <noscript>この教材を操作するにはJavaScriptを有効にしてください。</noscript>
  <script type="module" src="./app.js?v=20261110-5"></script>
</body>
</html>
